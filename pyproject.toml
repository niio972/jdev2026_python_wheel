
[project]
name = "jdev2026-python-wheel-acharleroy"
version = "0.2.0"
description = "Demo package wheel"
authors = [{name="Arnaud"}]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.package-data]
"jdev2026_python_wheel_acharleroy" = ["data/*.npz"]

[project.scripts]
decrypt-tool = "jdev2026_python_wheel_acharleroy.src.decrypt_rsa:run_decrypt_rsa"
